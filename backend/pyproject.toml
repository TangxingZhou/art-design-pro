]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]==0.139.0",
    "pydantic[email,timezone]>=2.10.5",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.2.0",
    "uvicorn[standard]>=0.50.0",
    "gunicorn>=26.0.0",
    "starlette>=1.3.1",
    "starlette-compress>=1.7.1",
    "starsessions>=2.2.1",
    "tortoise-orm[asyncpg]==1.1.7",
    "sqlalchemy[asyncio]==2.0.50",
    "sqlalchemy-utils>=0.42.1",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.4",
    "pymysql>=1.2.0",
    "sqlmodel>=0.0.33",
    "alembic>=1.18.0",
    "authlib>=1.7.2",
    "passlib==1.7.4",
    "bcrypt>=5.0.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    # "h11>=0.16.0",
    "aiohttp>=3.14.1",
    "aerich==0.8.1",
    "anyio==4.8.0",
    "argon2-cffi-bindings==21.2.0",
    "asyncclick==8.1.8",
    "certifi==2024.12.14",
    "cffi==1.17.1",
    "click==8.1.8",
    "dictdiffer==0.9.0",
    "dnspython==2.7.0",
    "httpx>=0.28.0,<1.0",
    "idna==3.10",
    "iso8601==2.1.0",
    "jinja2>=3.1.0",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "mypy-extensions==1.0.0",
    "orjson>=3.11.0",
    "packaging==24.2",
    "platformdirs==4.3.6",
    "pycparser==2.22",
    "python-multipart>=0.0.27",
    "pytz==2026.2",
    "pyyaml==6.0.2",
    "rich>=15.0.0",
    "shellingham==1.5.4",
    "sniffio==1.3.1",
    "ujson>=5.13.0",
    # "uvloop==0.21.0",
    # "watchfiles==1.0.4",
    "websockets>=16.0",
    "pyproject-toml>=0.1.0",
    "python-json-logger>=4.1.0",
    "pandas>=3.0.3",
    "colorlog>=6.10.1",
    "python-dateutil>=2.9.0.post0",
    "setuptools>=83.0.0",
    "wheel==0.47.0",
    "six>=1.17.0",
    "apscheduler>=3.11.0",
    "itsdangerous>=2.2.0",
    "boto3>=1.43.42",
    "asgiref>=3.11.1",
    "opentelemetry-sdk>=1.43.0",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "validators>=0.35.0",
    "ldap3>=2.9.1",
    "pycrdt>=0.14.1",
    "python-socketio>=5.16.3",
    "python-mimeparse>=2.0.0",
    "joserfc>=1.7.3",
]

[dependency-groups]
lint = ["ruff>=0.15.20", "black>=26.0.0", "isort>=8.0.1"]
type = ["mypy>=2.1.0"]
test = ["pytest>=9.1.0", "pytest-asyncio>=1.4.0", "coverage<8.0.0,>=7.15.0"]
docs = ["mkdocs-material>=9.7.0"]
dev = [
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "test"},
]

[tool.uv]
upgrade = false
index-url = "https://mirrors.aliyun.com/pypi/simple"

[tool.mypy]
strict = true
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
disallow_untyped_return = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[tool.black]
line-length = 120
# target-version = ["py311", "py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 120
exclude = ["alembic"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "C90",
  "Q",
  "ICN",
]

[tool.coverage.run]
# source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

